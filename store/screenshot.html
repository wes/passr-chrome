<!doctype html>
<!-- Store screenshot mock (1280x800). Uses the real popup.css with fake entries.
     Render: scripts/screenshots.sh -->
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../extension/popup.css">
<style>
  html, body { margin: 0; width: 1280px; height: 800px; overflow: hidden; }
  body.stage { width: 1280px; background: linear-gradient(135deg, #e9eefc, #f7f8fb); font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
  .browser { position: absolute; left: 60px; top: 50px; width: 1160px; height: 700px; background: #fff; border-radius: 12px; box-shadow: 0 30px 80px rgba(20,30,60,.18); overflow: hidden; }
  .bar { height: 44px; background: #f1f3f5; display: flex; align-items: center; padding: 0 16px; gap: 10px; border-bottom: 1px solid #e3e5e8; }
  .dots i { display: inline-block; width: 11px; height: 11px; border-radius: 50%; margin-right: 6px; background: #ddd; }
  .url { flex: 1; height: 28px; border-radius: 14px; background: #fff; display: flex; align-items: center; padding: 0 14px; color: #555; font-size: 13px; }
  .ext { width: 28px; height: 28px; border-radius: 6px; background: #dfe7ff; display: grid; place-items: center; }
  .ext img { width: 18px; }
  .page { display: grid; place-items: center; height: 656px; background: #fafafa; }
  .login { width: 340px; padding: 36px; background: #fff; border-radius: 12px; border: 1px solid #eee; }
  .login h2 { margin: 0 0 22px; font-size: 22px; color: #111; }
  .login label { display: block; font-size: 12px; color: #666; margin: 14px 0 6px; }
  .login .f { height: 38px; border: 1px solid #ddd; border-radius: 8px; padding: 0 12px; display: flex; align-items: center; font-size: 14px; color: #111; background: #f5f8ff; }
  .login .btn { margin-top: 22px; height: 40px; border-radius: 8px; background: #111; color: #fff; display: grid; place-items: center; font-size: 14px; }
  .popup { position: absolute; right: 84px; top: 90px; background: var(--bg); border-radius: 10px; box-shadow: 0 16px 50px rgba(0,0,0,.22); overflow: hidden; }
  .popup body, .popup { width: 360px; }
  .caption { position: absolute; left: 110px; bottom: 90px; font-size: 15px; color: #445; }
</style>
</head>
<body class="stage">
  <div class="browser">
    <div class="bar">
      <span class="dots"><i></i><i></i><i></i></span>
      <div class="url">🔒 acme.dev/login</div>
      <div class="ext"><img src="../extension/icons/icon32.png"></div>
    </div>
    <div class="page">
      <div class="login">
        <h2>Sign in to Acme</h2>
        <label>Username or email</label><div class="f">wes</div>
        <label>Password</label><div class="f">••••••••••••••••</div>
        <div class="btn">Sign in</div>
      </div>
    </div>
  </div>

  <div class="popup">
    <header>
      <input id="q" type="text" placeholder="Search pass…">
      <span id="site">acme.dev</span>
    </header>
    <ul id="list">
      <li class="sep">Matches for acme.dev</li>
      <li class="sel"><span class="match"></span><span class="txt"><div class="name"><span class="dir">acme/</span><span class="base">wes</span></div></span>
        <span class="acts"><button>pass</button><button>user</button><button>otp</button><button>fill</button></span></li>
      <li><span class="match"></span><span class="txt"><div class="name"><span class="dir">acme/</span><span class="base">work</span></div></span></li>
      <li><span class="match"></span><span class="txt"><div class="name"><span class="dir">acme/</span><span class="base">deploy-bot</span></div></span></li>
      <li class="sep">All</li>
      <li><span class="txt"><div class="name"><span class="dir">bank/</span><span class="base">checking</span></div></span></li>
      <li><span class="txt"><div class="name"><span class="dir">cloud/</span><span class="base">production</span></div></span></li>
      <li><span class="txt"><div class="name"><span class="dir">email/</span><span class="base">personal</span></div></span></li>
      <li><span class="txt"><div class="name"><span class="dir">social/</span><span class="base">wes</span></div></span></li>
      <li><span class="txt"><div class="name"><span class="dir">work/</span><span class="base">vpn</span></div></span></li>
      <li><span class="txt"><div class="name"><span class="dir"></span><span class="base">forum.example.org</span></div></span></li>
    </ul>
    <footer>
      <span><kbd>↵</kbd> fill</span>
      <span><kbd>⌘C</kbd> pass</span>
      <span><kbd>⌘U</kbd> user</span>
      <span><kbd>⌘O</kbd> otp</span>
    </footer>
  </div>
</body>
</html>
